<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><title>Alert control</title><rect width="100%" height="100%" fill="#050507"/><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;overflow:hidden"><iframe style="display:block;width:100%;height:100%;border:0"/></div></foreignObject><desc id="d"><![CDATA[<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#050507;color:#f5f3fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:20px;overflow:hidden;position:relative}
.aurora{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px)}
.a1{width:58%;height:78%;left:-14%;top:-8%;background:radial-gradient(closest-side,rgba(112,44,224,1),rgba(72,24,170,.6) 55%,transparent)}
.a2{width:46%;height:60%;left:30%;top:-24%;background:radial-gradient(closest-side,rgba(86,28,204,1),rgba(50,14,130,.55) 60%,transparent)}
.fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0,rgba(5,5,7,.55) 55%,#050507 100%)}
.card{position:relative;width:min(400px,100%);padding:32px 28px 26px;border-radius:18px;background:rgba(8,8,12,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}
.mark{display:inline-block;font-size:40px;font-weight:600;letter-spacing:-.045em;line-height:1;padding-bottom:10px;position:relative;text-shadow:0 0 40px rgba(139,92,246,.35)}
.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.65),0 0 40px rgba(167,139,250,.5)}
.sub{color:#8a869b;font-size:13px;margin:14px 0 22px}
input{width:100%;height:44px;margin:0 0 10px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0d0d12;color:inherit;font:inherit;font-size:14px;outline:0;transition:.18s}
input::placeholder{color:#5d5a6c}
input:focus{border-color:rgba(167,139,250,.6);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
#state{display:inline-flex;align-items:center;gap:9px;margin:14px 0 16px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:#cfccdc;background:#0d0d12;border:1px solid rgba(255,255,255,.07)}
#state:before{content:"";width:8px;height:8px;border-radius:50%;background:#5d5a6c}
#state.on{color:#fff;border-color:rgba(248,113,113,.45)}
#state.on:before{background:#f87171;box-shadow:0 0 12px #f87171}
#state.off:before{background:#8aefb0;box-shadow:0 0 10px rgba(138,239,176,.6)}
button{width:100%;height:46px;border:0;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6d3de0);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 22px rgba(109,61,224,.35);transition:.18s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
#msg{height:18px;margin-top:12px;font-size:12.5px;color:#f19b9b}
#msg.ok{color:#8aefb0}
</style>
</head>
<body>
<div class="aurora"><i class="a1"></i><i class="a2"></i></div><div class="fade"></div>
<div class="card">
<div class="mark">supreme</div>
<div class="sub">Alert control</div>
<input id="email" type="email" placeholder="Email" autocomplete="username">
<input id="pass" type="password" placeholder="Password" autocomplete="current-password">
<div id="state">Alert is ...</div>
<button id="btn">Toggle alert</button>
<div id="msg"></div>
</div>

<script>
// ---- Fill these in (Firebase console > Project settings) ----
var DB_URL  = "https://heads-up-761b5-default-rtdb.firebaseio.com"; // Realtime Database URL, no trailing slash
var API_KEY = "AIzaSyA6ccj6my9tb3nM2krAutGj8L-Rb3jMzeY";
// -------------------------------------------------------------

var on = false;
function $(id){ return document.getElementById(id); }

function refresh() {
  fetch(DB_URL + "/alert.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (v) {
      on = (v === true);
      $("state").textContent = "Alert is " + (on ? "ON" : "OFF"); $("state").className = on ? "on" : "off";
      $("btn").textContent = on ? "Turn alert OFF" : "Turn alert ON";
    })
    .catch(function () { $("state").textContent = "Can't reach database"; $("state").className = ""; });
}

$("btn").onclick = function () {
  $("msg").className = ""; $("msg").textContent = "Working...";
  fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + API_KEY, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: $("email").value, password: $("pass").value, returnSecureToken: true })
  })
    .then(function (r) { return r.json(); })
    .then(function (a) {
      if (!a.idToken) throw new Error("Sign-in failed");
      return fetch(DB_URL + "/alert.json?auth=" + a.idToken, {
        method: "PUT",
        body: JSON.stringify(!on)
      });
    })
    .then(function (r) {
      if (!r.ok) throw new Error("Write failed (" + r.status + ")");
      $("msg").className = "ok"; $("msg").textContent = "Done.";
      refresh();
    })
    .catch(function (e) { $("msg").className = ""; $("msg").textContent = e.message; });
};

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
]]></desc><script><![CDATA[document.querySelector("iframe").srcdoc=document.getElementById("d").textContent]]></script></svg>