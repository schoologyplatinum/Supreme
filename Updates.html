<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
:root{--bg:#050507;--panel:#08080b;--raise:#0d0d12;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--text:#f5f3fc;--muted:#8a869b;--dim:#5d5a6c;--acc:#8b5cf6;--acc2:#b79cff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1b1a24;border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(139,92,246,.35);color:#fff}

.main{position:fixed;inset:0;overflow-y:auto}
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.a1{width:58%;height:78%;left:-14%;top:-8%;background:radial-gradient(closest-side,rgba(112,44,224,1),rgba(72,24,170,.6) 55%,transparent);animation:d1 22s ease-in-out infinite alternate}
.a2{width:46%;height:60%;left:22%;top:-24%;background:radial-gradient(closest-side,rgba(86,28,204,1),rgba(50,14,130,.55) 60%,transparent);animation:d2 26s ease-in-out infinite alternate}
.a3{width:40%;height:50%;right:-12%;top:-18%;background:radial-gradient(closest-side,rgba(50,14,120,.6),transparent);animation:d3 30s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(6%,10%) rotate(14deg) scale(1.08)}}
@keyframes d2{to{transform:translate(-8%,12%) rotate(-10deg) scale(1.12)}}
@keyframes d3{to{transform:translate(-10%,8%) scale(.9)}}
.grain{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0,rgba(5,5,7,.55) 55%,var(--bg) 100%)}

.top{position:fixed;top:0;left:0;right:0;z-index:20;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-size:20px;font-weight:600;letter-spacing:-.04em}
.adminbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:500;color:#cfccdc;background:rgba(13,13,18,.7);border:1px solid var(--line);backdrop-filter:blur(10px);transition:.15s}
.adminbtn:hover{border-color:rgba(167,139,250,.45);color:#fff;background:rgba(139,92,246,.12)}
.adminbtn.live{border-color:rgba(167,139,250,.55);color:#fff}

.page{position:relative;max-width:760px;margin:0 auto;padding:110px 24px 70px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:#d9ccff;background:rgba(139,92,246,.18);border:1px solid rgba(167,139,250,.3);margin-bottom:14px}
.mark{font-size:clamp(40px,7vw,60px);font-weight:600;letter-spacing:-.045em;line-height:1;padding-bottom:12px;position:relative;display:inline-block;text-shadow:0 0 40px rgba(139,92,246,.35);margin-bottom:28px}
.mark:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.65),0 0 40px rgba(167,139,250,.5)}
.panel{background:rgba(11,11,16,.8);border:1px solid var(--line);border-radius:14px;padding:26px 28px;backdrop-filter:blur(6px)}
.panel h1{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:-.03em;overflow-wrap:anywhere}
.when{color:var(--dim);font-size:12.5px;margin-bottom:18px}
.body{color:#cfccdc;font-size:15px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* editor */
.editor{margin-top:14px}
.editor h3{margin:0 0 14px;font-size:15px}
label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:500}
.in{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--raise);padding:0 14px;font-size:14px;outline:0;transition:.18s}
input.in{height:44px}
textarea.in{padding:12px 14px;min-height:170px;resize:vertical;line-height:1.6}
.in::placeholder{color:var(--dim)}
.in:focus{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 3px rgba(139,92,246,.14)}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6d3de0);color:#fff;font-size:13.5px;font-weight:600;transition:.18s;box-shadow:0 6px 22px rgba(109,61,224,.35)}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:var(--raise);border:1px solid var(--line2);box-shadow:none}
.status{font-size:12.5px;color:#8aefb0}
.status.err{color:#f19b9b}
.field{margin-bottom:14px}

/* passcode modal */
#gate{position:fixed;inset:0;z-index:1000;display:none;place-items:center;background:rgba(5,5,7,.72);backdrop-filter:blur(8px)}
#gate.on{display:grid}
.gbox{width:min(380px,calc(100% - 32px));text-align:center;padding:30px 28px;border-radius:18px;background:rgba(8,8,12,.92);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.gbox .t{font-size:18px;font-weight:600;letter-spacing:-.02em}
.gbox p{color:var(--muted);font-size:13.5px;margin:8px 0 18px}
.gbox input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);padding:0 14px;text-align:center;font-size:15px;outline:0;letter-spacing:.2em}
.gbox input:focus{border-color:rgba(167,139,250,.6);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.gbox .btn{width:100%;justify-content:center;margin-top:10px;height:44px;padding:0}
.gbox .ghost{width:100%;margin-top:8px;height:40px;color:var(--muted);font-size:13px}
.gerr{height:18px;margin-top:10px;font-size:12.5px;color:#f19b9b}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(max-width:600px){.page{padding:96px 16px 50px}.panel{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<div class="grain"></div>

<div class="top">
  <span class="brand">supreme</span>
  <button class="adminbtn" id="adminBtn" type="button"><svg class="i" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span id="adminLbl">Admin</span></button>
</div>

<div class="main"><div class="page">
  <div class="pill">Updates</div><br>
  <div class="mark">Updates</div>
  <div class="panel" id="view"><div class="empty">Loading...</div></div>

  <div class="panel editor" id="editor" style="display:none">
    <h3>Edit announcement</h3>
    <div class="field"><label class="f" for="eTitle">Title</label><input class="in" id="eTitle" type="text" maxlength="120" placeholder="Title" autocomplete="off"></div>
    <div class="field"><label class="f" for="eBody">Announcement</label><textarea class="in" id="eBody" maxlength="4000" placeholder="Write the announcement..."></textarea></div>
    <div class="row">
      <button class="btn" id="pub" type="button">Publish</button>
      <span class="status" id="st"></span>
    </div>
  </div>
</div></div>

<div id="gate" role="dialog" aria-modal="true" aria-label="Admin code">
  <form class="gbox" id="gform" autocomplete="off">
    <div class="t">Admin</div>
    <p>Enter the admin code.</p>
    <input id="gcode" type="password" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="••••••" aria-label="Admin code">
    <button class="btn" type="submit" id="gsub">Continue</button>
    <button class="btn ghost" type="button" id="gcancel">Cancel</button>
    <div class="gerr" id="gerr" role="alert"></div>
  </form>
</div>

<script>
/* ---- Firebase (Realtime Database) ---- */
var DB_URL="https://heads-up-761b5-default-rtdb.firebaseio.com";
var API_KEY="AIzaSyA6ccj6my9tb3nM2krAutGj8L-Rb3jMzeY";
var ADMIN_EMAIL="updates@supreme.app";   /* the Firebase user that publishes */
var PW_SUFFIX="-updates";                /* admin code + this = that user's password */

function $(id){return document.getElementById(id)}
var admin=false,code='',current;

/* ---- show the announcement ---- */
function fmt(t){try{return new Date(t).toLocaleString([], {dateStyle:'long',timeStyle:'short'})}catch(e){return ''}}
function render(d){
  var v=$('view');v.replaceChildren();
  if(!d||(!d.title&&!d.body)){var e=document.createElement('div');e.className='empty';e.textContent='No announcements yet.';v.appendChild(e);return}
  var h=document.createElement('h1');h.textContent=d.title||'';
  var w=document.createElement('div');w.className='when';w.textContent=d.time?'Posted '+fmt(d.time):'';
  var b=document.createElement('div');b.className='body';b.textContent=d.body||'';
  v.appendChild(h);if(d.time)v.appendChild(w);v.appendChild(b);
}
function load(){
  fetch(DB_URL+'/updates.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var s=JSON.stringify(d);
    if(current===undefined||s!==JSON.stringify(current)){current=d;render(d)}
  }).catch(function(){if(current===undefined)render(null)});
}
load();setInterval(function(){if(!admin||document.activeElement.id!=='eTitle'&&document.activeElement.id!=='eBody')load()},15000);

/* ---- sign in (the admin code is the key: it is checked by Firebase, not stored here) ---- */
function signIn(c){
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+API_KEY,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:ADMIN_EMAIL,password:c.toLowerCase()+PW_SUFFIX,returnSecureToken:true})
  }).then(function(r){return r.json()}).then(function(a){if(!a.idToken)throw new Error('bad');return a.idToken});
}

/* ---- admin button + passcode ---- */
var gate=$('gate'),gcode=$('gcode'),gerr=$('gerr'),gform=$('gform');
function openGate(){gerr.textContent='';gcode.value='';gate.classList.add('on');setTimeout(function(){gcode.focus()},30)}
function closeGate(){gate.classList.remove('on')}
$('adminBtn').onclick=function(){
  if(admin){setAdmin(false);return}
  openGate();
};
$('gcancel').onclick=closeGate;
gate.addEventListener('mousedown',function(e){if(e.target===gate)closeGate()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeGate()});
gform.addEventListener('submit',function(e){
  e.preventDefault();var v=gcode.value.trim();if(!v)return;
  $('gsub').disabled=true;gerr.textContent='';
  signIn(v).then(function(){
    code=v;closeGate();setAdmin(true);
  }).catch(function(){
    gerr.textContent='Incorrect code. Try again.';gcode.value='';
    gform.classList.remove('shake');void gform.offsetWidth;gform.classList.add('shake');gcode.focus();
  }).then(function(){$('gsub').disabled=false});
});
function setAdmin(on){
  admin=on;
  $('editor').style.display=on?'block':'none';
  $('adminBtn').classList.toggle('live',on);
  $('adminLbl').textContent=on?'Exit admin':'Admin';
  if(on){
    $('eTitle').value=(current&&current.title)||'';
    $('eBody').value=(current&&current.body)||'';
    $('st').textContent='';$('st').className='status';
  } else code='';
}

/* ---- publish ---- */
$('pub').onclick=function(){
  var t=$('eTitle').value.trim(),b=$('eBody').value.trim(),st=$('st');
  if(!t&&!b){st.className='status err';st.textContent='Add a title or an announcement first.';return}
  $('pub').disabled=true;st.className='status';st.textContent='Publishing...';
  signIn(code).then(function(tok){
    return fetch(DB_URL+'/updates.json?auth='+tok,{method:'PUT',body:JSON.stringify({title:t,body:b,time:Date.now()})});
  }).then(function(r){
    if(!r.ok)throw new Error('Could not publish ('+r.status+')');
    return r.json();
  }).then(function(d){
    current=d;render(d);st.className='status';st.textContent='Published.';
  }).catch(function(e){st.className='status err';st.textContent=e.message==='bad'?'Sign-in failed.':e.message})
  .then(function(){$('pub').disabled=false});
};
</script>
</body>
</html>
